spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

logging:
  level:
    root: info
    com.kay.pfie: info

pfie:
  auth:
    jwt:
      issuer: ${JWT_ISSUER}
      secret: ${JWT_SECRET}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
  user-defaults:
    currency: ${USER_DEFAULT_CURRENCY}
    time-zone: ${USER_DEFAULT_TIME_ZONE}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_REGION}
      endpoint: ${S3_ENDPOINT:}
      accessKey: ${AWS_ACCESS_KEY_ID}
      secretKey: ${AWS_SECRET_ACCESS_KEY}
      pathStyleAccess: ${S3_PATH_STYLE_ACCESS:false}
