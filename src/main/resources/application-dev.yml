spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:${POSTGRES_DB}}
    username: ${PGUSER:${POSTGRES_USER}}
    password: ${PGPASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

logging:
  level:
    root: info
    com.kay.pfie: debug

pfie:
  auth:
    jwt:
      issuer: ${JWT_ISSUER:pfie}
      secret: ${JWT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
  user-defaults:
    currency: ${USER_DEFAULT_CURRENCY:NGN}
    time-zone: ${USER_DEFAULT_TIME_ZONE:UTC}
  storage:
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:}
      endpoint: ${S3_ENDPOINT:}
      accessKey: ${AWS_ACCESS_KEY_ID:}
      secretKey: ${AWS_SECRET_ACCESS_KEY:}
      pathStyleAccess: ${S3_PATH_STYLE_ACCESS:false}
